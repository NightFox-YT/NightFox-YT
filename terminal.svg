<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal profile info">
  <title>Terminal profile info</title>
  <style>
    .terminal {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      fill: #00ff00;
    }
    .blink {
      opacity: 0;
      animation: blink 1s infinite;
      animation-delay: 6s;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .line {
      opacity: 1;
      animation: fadeIn 0.5s forwards;
    }
    .window {
      opacity: 0;
      transform-origin: 250px 100px;
      animation: window_pop 0.3s ease-out forwards;
      animation-delay: 0.4s;
    }
    @keyframes window_pop {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.7);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>

  <!-- Анимации для строк -->
  <defs>
    <mask id="typing-mask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100%" height="100%" fill="#000"/>
      <rect x="10" y="35" width="0" height="20" fill="#fff">
        <animate attributeName="width" from="0" to="470" dur="1s" begin="1s" fill="freeze"/>
      </rect>
      <rect x="10" y="65" width="0" height="20" fill="#fff">
        <animate attributeName="width" from="0" to="470" dur="1s" begin="2s" fill="freeze"/>
      </rect>
      <rect x="10" y="90" width="0" height="20" fill="#fff">
        <animate attributeName="width" from="0" to="470" dur="1s" begin="3s" fill="freeze"/>
      </rect>
      <rect x="10" y="115" width="0" height="20" fill="#fff">
        <animate attributeName="width" from="0" to="470" dur="1s" begin="4s" fill="freeze"/>
      </rect>
      <rect x="10" y="140" width="0" height="20" fill="#fff">
        <animate attributeName="width" from="0" to="470" dur="1s" begin="5s" fill="freeze"/>
      </rect>
    </mask>
  </defs>
  
  <!-- Окно терминала -->
  <g class="window">
    <rect width="100%" height="100%" fill="#0d1117"/>
    <rect width="100%" height="30" fill="#161b22"/>
    <circle cx="15" cy="15" r="5" fill="#ff5f56"/>
    <circle cx="32" cy="15" r="5" fill="#ffbd2e"/>
    <circle cx="49" cy="15" r="5" fill="#27c93f"/>
    <text x="75" y="20" class="terminal">nightfox@github:~$</text>

    <!-- Текст обо мне -->
    <g class="lines" mask="url(#typing-mask)">
      <text x="10" y="55" class="terminal line">$ About Me</text>
      <text x="10" y="80" class="terminal line">&gt; High school student</text>
      <text x="10" y="105" class="terminal line">&gt; Creating bots for Telegram &amp; Discord</text>
      <text x="10" y="130" class="terminal line">&gt; Building own OS in NASM</text>
      <text x="10" y="155" class="terminal line">&gt; Exploring the depths of programming</text>
    </g>

    <text x="10" y="180" class="terminal blink">█</text>
  </g>
</svg>
